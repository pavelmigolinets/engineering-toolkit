name: Validate toolkit
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate skill and agent structure
        run: python3 scripts/validate-toolkit.py

      - name: Check installer syntax and behavior
        run: |
          bash -n scripts/install-skills.sh
          bash -n scripts/install-agents.sh
          bash scripts/test-installers.sh
